[package]
name = "quickytrade-desktop"
version = "1.1.0"
description = "QuickyTrade macOS Desktop Application (Tauri v2)"
authors = ["QuickyTrade Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
